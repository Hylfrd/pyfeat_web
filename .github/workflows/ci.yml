name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          check-latest: true

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          check-latest: true
          cache: "npm"

      - name: Check Python
        run: |
          python -m pip install --upgrade pip pip-audit
          python -m pip install --require-hashes -r requirements.txt
          python -m pip check
          python -m pip_audit -r requirements.txt --disable-pip --require-hashes
          python -m compileall -q app

      - name: Build frontend
        run: |
          npm ci
          npm audit --registry=https://registry.npmjs.org
          npm run build

      - name: Check application compatibility
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          from app.main import app
          client = TestClient(app)
          for path in ("/", "/admin", "/static/dist/participant.js", "/static/dist/admin.js"):
              response = client.get(path)
              assert response.status_code == 200 and response.content, path
          assert client.get("/api/admin/auth").status_code == 401
          assert client.post("/api/admin/login", data={"token": "invalid"}).status_code == 503
          print("Pages, assets, admin auth and multipart form parsing passed")
          PY

      - name: Check repository hygiene
        shell: bash
        run: |
          blocked="$(find . -maxdepth 1 -type f \( \
            -iname 'clear_*participants*.ps1' -o \
            -iname 'clear_*demo*.ps1' -o \
            -iname 'cleanup_*participants*.ps1' -o \
            -iname 'cleanup_*demo*.ps1' -o \
            -iname 'deploy_restart.ps1' -o \
            -iname 'install_server_deps.bat' -o \
            -iname 'install_windows_task.ps1' -o \
            -iname 'run_server.cmd' -o \
            -iname 'start_server.bat' \
          \) -print)"
          if [ -n "$blocked" ]; then
            echo "Do not commit one-off data maintenance scripts:"
            echo "$blocked"
            exit 1
          fi

      - name: Deploy files to server
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          source: "app/**,static/**,requirements.txt,deploy.ps1,logging.json,Caddyfile.example"
          target: "/c/web/"
          tar_dereference: true
          overwrite: true

      - name: Restart server app
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: powershell.exe -NoProfile -ExecutionPolicy Bypass -File C:/web/deploy.ps1
