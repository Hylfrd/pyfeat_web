name: Runtime maintenance

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Runtime operation
        required: true
        default: inspect
        type: choice
        options:
          - inspect
          - update-caddy

permissions:
  contents: read

concurrency:
  group: windows-runtime-maintenance
  cancel-in-progress: false

jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        if: inputs.operation == 'update-caddy'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache-dependency-path: scripts/caddy/go.sum

      - name: Build and audit Caddy
        if: inputs.operation == 'update-caddy'
        id: caddy
        working-directory: scripts/caddy
        env:
          CGO_ENABLED: '0'
          GOTOOLCHAIN: local
        run: |
          set -euo pipefail
          go version
          go mod verify
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          mkdir -p ../../runtime-payload
          GOOS=windows GOARCH=amd64 go build -mod=readonly -trimpath -ldflags '-X github.com/caddyserver/caddy/v2.CustomVersion=v2.11.7' -o ../../runtime-payload/caddy.exe github.com/caddyserver/caddy/v2/cmd/caddy
          go version -m ../../runtime-payload/caddy.exe > ../../runtime-payload/build-info.txt
          govulncheck -mode binary ../../runtime-payload/caddy.exe | tee ../../runtime-payload/govulncheck.txt
          sha256sum ../../runtime-payload/caddy.exe | tee ../../runtime-payload/sha256.txt
          echo "sha256=$(sha256sum ../../runtime-payload/caddy.exe | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - name: Save audited runtime artifact
        if: inputs.operation == 'update-caddy'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: caddy-windows-go1.27.3-xnet0.60.0
          path: runtime-payload/
          retention-days: 30

      - name: Upload audited Caddy
        if: inputs.operation == 'update-caddy'
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          source: runtime-payload/caddy.exe
          target: /c/web/
          overwrite: true

      - name: Upload runtime script
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          source: scripts/runtime.ps1
          target: /c/web/
          overwrite: true

      - name: Inspect server runtime
        if: inputs.operation == 'inspect'
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: powershell.exe -NoProfile -ExecutionPolicy Bypass -File C:/web/scripts/runtime.ps1 -Operation inspect

      - name: Update server runtime
        if: inputs.operation == 'update-caddy'
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          command_timeout: 8m
          script: powershell.exe -NoProfile -ExecutionPolicy Bypass -File C:/web/scripts/runtime.ps1 -Operation update-caddy -ExpectedSha256 ${{ steps.caddy.outputs.sha256 }}
